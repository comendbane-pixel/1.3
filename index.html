<!doctype html>
<html lang="fr" data-theme="dark" data-anim="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11" id="metaTheme">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<title>FC27 Companion</title>
<style>
:root{
  --ch:#ff4d00;
  --bg:#f4f6f8;--surface:#ffffff;--surface2:#eaeef2;--text:#141a22;--muted:#5b6673;--line:#d9dfe6;
  --accent:#2563eb;--accent-text:#ffffff;--up:#0f8a4b;--down:#c62828;--warn:#9a6700;
  --ease:cubic-bezier(.4,0,.2,1);--tpage:.28s;--tind:.38s;--tsheet:.28s;
  --nav-h:62px;
}
[data-theme=dark]{
  --bg:#0a0c11;--surface:#13161d;--surface2:#1d212b;--text:#f1f3f7;--muted:#8d96a6;--line:#242a35;
  --accent:#3ddc84;--accent-text:#04140b;--up:#3ddc84;--down:#ff5d5d;--warn:#f0b429;
}
[data-anim=reduced]{--tpage:.12s;--tind:.12s;--tsheet:.12s}
[data-anim=none]{--tpage:0s;--tind:0s;--tsheet:0s}
[data-anim=none] *,[data-anim=none] *::before,[data-anim=none] *::after{animation:none!important;transition:none!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto}

/* ---------- haut de page ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
.top .wrap{display:flex;flex-direction:column;gap:2px}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px;text-transform:uppercase}
.brand::before{content:"";display:inline-block;width:10px;height:18px;border-radius:3px;background:var(--accent);margin-right:8px;vertical-align:-2px;transform:skewX(-12deg)}
.upd{font-size:12.5px;color:var(--muted)}
.upd b{color:var(--text);font-weight:600}

main{padding:10px 12px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
.page{display:none}
.page.active{display:block;animation:pgin var(--tpage) var(--ease) both}
[data-anim=reduced] .page{--dx:0px!important}
@keyframes pgin{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.page.from-r{--dx:26px}.page.from-l{--dx:-26px}

h2{font-size:17px;margin:14px 2px 8px}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin:8px 0}
.empty{text-align:center;padding:36px 16px}
.empty .big{font-size:18px;font-weight:700;margin-bottom:6px}
pre{background:var(--surface2);border-radius:10px;padding:10px;overflow:auto;font-size:12px;white-space:pre-wrap}

/* ---------- boutons et champs ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--down);border-color:var(--down)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:40px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.controls .full{grid-column:1/-1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-weight:600;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- cartes (image de la source, rien dessus) ---------- */
/* Photo du joueur posée sur le fond de carte. Pour la déplacer ou la grossir, change ces 3 nombres :
   --fx = distance depuis la gauche, --fy = distance depuis le haut, --fw = largeur (en % de la carte). */
.cardbox{display:block;flex:none;aspect-ratio:3/4;position:relative;container-type:inline-size;--fx:14%;--fy:11%;--fw:84%}
.cardbox .face{position:absolute;left:50%;transform:translateX(-50%);top:var(--fy);width:var(--fw);height:52%;object-fit:contain;object-position:50% 100%;pointer-events:none}
.cardbox img.bg{display:block;width:100%;height:100%;object-fit:contain}
.ov{font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;--g:#fff;position:absolute;inset:0;color:var(--g);text-shadow:0 0 2px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.8);pointer-events:none}
/* Couleur du texte selon la carte : violet/foncé coloré = doré, noir = crème, clair (or, icône) = brun foncé */
.cardbox.gd .ov{--g:#f4d97e;text-shadow:none}
.cardbox.cr .ov{--g:#ece7da;text-shadow:none}
.cardbox.lt .ov{--g:#2e2308;text-shadow:none}
.ov .r{position:absolute;left:11%;width:18%;text-align:center;top:20%;font-weight:800;font-size:15cqw;line-height:1}
.ov .p{position:absolute;left:11%;width:18%;text-align:center;top:34%;font-weight:700;font-size:8.5cqw;line-height:1}
.ov .n{position:absolute;left:5%;right:5%;top:60%;text-align:center;font-weight:800;font-size:9.5cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .s{position:absolute;left:10%;right:10%;top:68.5%;display:grid;grid-template-columns:repeat(6,1fr);text-align:center}
.ov .s i{display:block;font-style:normal;font-size:5.6cqw;font-weight:700;line-height:1.1}
.ov .s b{display:block;font-size:7.6cqw;line-height:1.15}
.ov .sw{position:absolute;right:10%;top:49%;width:17%;text-align:center;font-weight:800;font-size:7cqw;line-height:1.1;border:1px solid currentColor;border-radius:2cqw;padding:1cqw 0;opacity:.95}
.ov .bd{position:absolute;left:0;right:0;top:79.5%;display:flex;justify-content:center;align-items:center;gap:4cqw}
.ov .bd em{font-style:normal;font-weight:700;font-size:4.6cqw;letter-spacing:.03em;background:rgba(0,0,0,.18);border-radius:2cqw;padding:.6cqw 1.6cqw}
.ov .bd img{height:6.5cqw;width:auto;max-width:10cqw;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.cardbox.sm{width:50px}
.cardbox.md{width:min(150px,80%)}
.cardbox.lg{width:132px}
.cardbox.fb{background:#9aa0a6;display:flex;align-items:center;justify-content:center}
.cardbox.fb b{font-size:20px;color:#fff}
.cardbox.lg.fb b{font-size:36px}

/* ---------- carte dessinée par l'appli (design à nous, nette à toute taille) ---------- */
.fc{--c1:#f4e3a1;--c2:#cfa23a;--c3:#7d5a14;--ink:#2a1f06;container-type:inline-size;position:relative;display:block;flex:none;aspect-ratio:5/7;border-radius:12% / 8.5%;overflow:hidden;
  background:radial-gradient(120% 80% at 30% 0%,var(--c1),var(--c2) 55%,var(--c3));color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(255,255,255,.35)}
.fc::before{content:"";position:absolute;inset:3.5%;border-radius:10% / 7%;border:1px solid rgba(255,255,255,.4);pointer-events:none}
.fc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);pointer-events:none}
.fc.silver{--c1:#f3f5f8;--c2:#b6bec9;--c3:#6a7381;--ink:#1c222a}
.fc.bronze{--c1:#f1cba3;--c2:#b97a45;--c3:#6a3c18;--ink:#2c1704}
.fc.sm{width:54px}.fc.md{width:min(150px,80%)}.fc.lg{width:150px}
.fc-r{position:absolute;left:10%;top:8%;font-weight:800;font-size:21cqw;line-height:1}
.fc-p{position:absolute;left:10%;top:30%;font-weight:700;font-size:8.5cqw;line-height:1}
.fc-ph{position:absolute;right:4%;top:5%;width:72%;height:56%;display:flex;align-items:flex-end;justify-content:center}
.fc-ph img{position:absolute;bottom:0;max-width:100%;max-height:100%;object-fit:contain;object-position:bottom}
.fc-ph svg{width:80%;height:100%;opacity:.25;fill:currentColor}
.fc-n{position:absolute;left:6%;right:6%;top:62%;text-align:center;font-weight:800;font-size:9cqw;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2.5cqw;border-bottom:1px solid rgba(0,0,0,.22)}
.fc-s{position:absolute;left:10%;right:10%;top:73%;display:grid;grid-template-columns:repeat(6,1fr);text-align:center}
.fc-s b{display:block;font-size:9cqw;line-height:1.1}
.fc-s i{display:block;font-style:normal;font-size:6cqw;font-weight:700;opacity:.75}
.fc-b{position:absolute;left:8%;top:40%;width:19%;display:flex;flex-direction:column;gap:6%;font-size:5.6cqw;font-weight:800;text-transform:uppercase;text-align:center}
.fc-b span{white-space:nowrap;overflow:hidden;background:rgba(0,0,0,.14);border-radius:3cqw;padding:1.5cqw 0}
.fc.sm .fc-n,.fc.sm .fc-s,.fc.sm .fc-b,.fc.sm .fc-p{display:none}
.fc.sm .fc-r{font-size:30cqw}

/* ---------- bandeau ---------- */
.tk{overflow-x:auto;overflow-y:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;scrollbar-width:none}
.tk::-webkit-scrollbar{display:none}
.tk-track{display:flex;width:max-content}
.tk-set{display:flex;gap:6px;padding:8px 6px}
.tk-dup{display:none}
[data-anim=full] .tk{overflow:hidden}
[data-anim=full] .tk-dup{display:flex}
[data-anim=full] .tk-track{animation:tk 45s linear infinite}
[data-anim=full] .tk:active .tk-track,[data-anim=full] .tk:hover .tk-track{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
.tk button{border:0;background:var(--surface2);border-radius:10px;padding:6px 10px;white-space:nowrap;font-size:13px}

/* ---------- liste ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;background:linear-gradient(180deg,var(--surface2),var(--surface) 60%);border:1px solid var(--line);border-radius:14px;min-width:0;transition:transform .15s var(--ease),border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.open{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:0;background:none;padding:12px 6px 10px;width:100%;min-width:0}
.nm{font-weight:700;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .rt{font-weight:600;color:var(--muted);margin-left:4px}
.sub{font-size:11.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg{display:grid;grid-template-columns:repeat(6,1fr);width:100%;gap:2px;margin-top:2px}
.sg div{text-align:center;line-height:1.15}
.sg b{display:block;font-size:13px;font-weight:800}
.sg i{display:block;font-style:normal;font-size:9.5px;color:var(--muted);font-weight:600}
.stats{font-size:10.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-weight:800;font-size:16px;color:var(--warn);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:5px}
.coin{width:15px;height:15px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 32% 28%,#fff3c2,#f0b429 55%,#b57e00);box-shadow:0 0 0 1px #8a5d00,inset 0 0 0 2px rgba(255,255,255,.35)}
.customcoin .coin{background:url(coin.png) center/contain no-repeat;box-shadow:none;border-radius:0;width:20px;height:20px}
.customcoin .coin::after{display:none}
.customcoin .big-price .coin{width:26px;height:26px}
.coin::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid rgba(120,80,0,.55)}
.chg{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}.fl{color:var(--muted)}
.star{position:absolute;top:4px;right:4px;width:36px;height:36px;border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.star[aria-pressed=true]{color:#e0a800}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--surface2)}
.badge.hi{background:var(--up);color:#fff}.badge.mid{background:var(--warn);color:#fff}.badge.lo{background:var(--muted);color:var(--bg)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}

/* ---------- barre du bas ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{position:relative;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
nav button[aria-selected=true]{color:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#ind{position:absolute;top:0;left:0;width:20%;height:3px;display:flex;justify-content:center;transform:translateX(calc(var(--i,0)*100%));transition:transform var(--tind) var(--ease);pointer-events:none}
#ind::after{content:"";width:34px;height:3px;border-radius:3px;background:var(--accent)}
.dot{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--down);display:none}
.dot.on{display:block}

/* ---------- fiche détaillée ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);animation:fade var(--tsheet) var(--ease)}
.sheet[hidden]{display:none}
.panel{position:absolute;inset:0;overflow:auto;background:var(--bg);animation:up var(--tsheet) var(--ease)}
.pgtop{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
.pgtop .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;display:flex;align-items:center;gap:6px}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--text)}
.pgbody{max-width:1180px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 40px)}
.pgbody h1{font-size:clamp(22px,4.6vw,34px);margin:4px 0 4px;line-height:1.15;text-wrap:balance}
.pgbody .lead{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:80ch}
.pg{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media(min-width:860px){.pg{grid-template-columns:330px 1fr}}
.pgl,.pgr{display:flex;flex-direction:column;gap:14px;min-width:0}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card2>h3{margin:0;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card2 .pad{padding:14px}
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 14px}
.hero .hrow{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.pstyles{display:flex;flex-direction:column;gap:8px}
.psi{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border,#2a2f3b);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted,#8b93a5);overflow:hidden}
.psi img{width:30px;height:30px;object-fit:contain}
.psi.gold{border-color:#f0b429;box-shadow:0 0 8px rgba(240,180,41,.55);background:#2a2210}
.pslist{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.pslist .r{display:flex;align-items:center;gap:8px;font-size:13px}
.pslist .r.gold b{color:#f0b429}
.hero .cardbox.lg,.hero .fc.lg{width:min(230px,62vw)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right;min-width:0;overflow-wrap:anywhere}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.mini3>div{padding:10px 6px;text-align:center;border-left:1px solid var(--line)}
.mini3>div:first-child{border-left:0}
.mini3 b{display:block;font-size:17px}
.mini3 span{font-size:11px;color:var(--muted)}
.bigp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bigp b{font-size:clamp(28px,6vw,38px);font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.bigp .coin{width:26px;height:26px}
.momo{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#5b3cff,#ff4d3d);margin:26px 0 8px}
.momo i{position:absolute;top:-9px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--text);transform:translateX(-50%)}
.momo-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.momo-l b{display:block;color:var(--text);font-size:13px}
.attr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px}
.at{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.at .t{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.at .v{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.at .v b{font-size:26px;font-variant-numeric:tabular-nums}
.at .bar{height:6px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.at .bar i{display:block;height:100%;border-radius:4px}
.at svg{width:54px;height:34px}
.gu{color:var(--up)}.gw{color:var(--warn)}.gd{color:var(--down)}
.bg-u{background:var(--up)}.bg-w{background:var(--warn)}.bg-d{background:var(--down)}
.pgr .box{margin:0}
.close{position:static;margin-left:auto}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
[data-anim=reduced] .panel{animation-name:fade}
.head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:4px}
.head .info{width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.head h2{margin:0;font-size:22px}
.head .cardbox.lg,.head .fc.lg{width:min(190px,52vw)}
.close{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;font-size:18px;flex:none;z-index:2}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips span{background:var(--surface2);border-radius:20px;padding:3px 10px;font-size:12.5px;color:var(--muted);font-weight:600}
.big-price{font-size:28px;font-weight:800;color:var(--warn);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.big-price .coin{width:20px;height:20px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.sgrid div{background:var(--surface2);border-radius:10px;padding:6px 8px;text-align:center}
.sgrid b{display:block;font-size:17px}
.sgrid span{font-size:11px;color:var(--muted)}
.cv{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.chart{width:100%;height:auto;display:block}
.cl{font-size:9.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chead{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.chead h3{margin:0 0 6px}
.ch-left{min-width:0;flex:1 1 220px}
.ch-price{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch-price b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.ch-date{font-size:12.5px;color:var(--muted);margin-top:3px}
.pill{border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:700;background:var(--surface2);font-variant-numeric:tabular-nums}
.pill.up{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.pill.dn{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down)}
.pill.fl{color:var(--muted)}
.tabs2{display:flex;gap:2px;background:var(--surface2);border-radius:20px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{border:0;background:none;border-radius:16px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs2 button[aria-selected=true]{background:var(--ch);color:#fff}
.simtag{display:inline-block;vertical-align:middle;margin-left:6px;border:1px dashed var(--warn);color:var(--warn);border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-top:6px}
.tri div{background:var(--surface2);border-radius:10px;padding:6px}
.tri b{display:block;font-variant-numeric:tabular-nums}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:80;max-width:90%;font-size:14px;animation:fade var(--tsheet) var(--ease)}
.toast[hidden]{display:none}
label.l{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">FC27 Companion</div>
  <div class="upd" id="upd">En attente des premiers prix</div>
  <div class="upd">Prix non temps réel : jusqu'à environ 2 jours de retard.</div>
</div></header>

<main class="wrap" id="main">
  <section class="page" id="p0" aria-label="Marché">
    <div id="mkEmpty" hidden></div>
    <div id="mkBody">
      <div id="tickerBox"></div>
      <div class="controls">
        <input class="field full" id="q" type="search" placeholder="Rechercher un joueur, un club…" autocomplete="off" aria-label="Rechercher">
        <select class="field" id="fPos" aria-label="Poste"></select>
        <select class="field" id="fRat" aria-label="Note minimale">
          <option value="0">Toutes les notes</option><option value="75">75 et +</option><option value="80">80 et +</option>
          <option value="83">83 et +</option><option value="85">85 et +</option><option value="87">87 et +</option><option value="90">90 et +</option>
        </select>
        <input class="field" id="fMax" type="number" inputmode="numeric" min="0" placeholder="Prix max" aria-label="Prix maximum">
        <select class="field" id="fSort" aria-label="Trier par">
          <option value="price-desc">Prix : du plus cher</option><option value="price-asc">Prix : du moins cher</option>
          <option value="rating-desc">Note : la plus haute</option><option value="chg-desc">Plus fortes hausses</option>
          <option value="chg-asc">Plus fortes baisses</option><option value="name-asc">Nom A → Z</option>
        </select>
        <div class="full row2"><button class="chip" id="fFav" aria-pressed="false">★ Favoris seulement</button><span class="small muted" id="count"></span></div>
      </div>
      <div id="list"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>

  <section class="page" id="p1" aria-label="Conseils"></section>
  <section class="page" id="p2" aria-label="SBC"></section>
  <section class="page" id="p3" aria-label="Portefeuille"></section>
  <section class="page" id="p4" aria-label="Réglages"></section>
</main>

<nav aria-label="Navigation"><div class="wrap" role="tablist" id="tabs">
  <span id="ind"></span>
  <button role="tab" data-tab="0" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Marché</button>
  <button role="tab" data-tab="1" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Conseils</button>
  <button role="tab" data-tab="2" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><path d="M17 13v8M13 17h8"/></svg>SBC</button>
  <button role="tab" data-tab="3" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>Portefeuille<i class="dot" id="dot"></i></button>
  <button role="tab" data-tab="4" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Réglages</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Fiche joueur"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
'use strict';

/* =====================================================================
   Outils
   ===================================================================== */
const TAX = 0.05;            // taxe EA : 5 %
const PAGE = 40;             // cartes par page
const REFRESH = 10 * 60e3;   // on relit data.json au plus toutes les 10 minutes
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nfr = new Intl.NumberFormat('fr-FR');
const fmt = (n) => (n == null || !isFinite(n) ? '—' : nfr.format(Math.round(n)));
const pct = (v) => (v == null ? '' : (v > 0 ? '+' : '') + (v * 100).toFixed(1).replace('.', ',') + ' %');
const norm = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const p2 = (n) => String(n).padStart(2, '0');
const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\//i.test(u.trim()) ? u.trim() : '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = (v) => { const n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };

/* =====================================================================
   Sauvegarde locale (localStorage, sinon mémoire)
   ===================================================================== */
const KEY = 'fc27companion.v1';
const mem = {};
let storageOK = false;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); storageOK = true; } catch (e) { storageOK = false; }
const store = {
  get(k) { try { if (storageOK) return localStorage.getItem(k); } catch (e) { storageOK = false; } return k in mem ? mem[k] : null; },
  set(k, v) { try { if (storageOK) { localStorage.setItem(k, v); return; } } catch (e) { storageOK = false; } mem[k] = v; },
  del(k) { try { if (storageOK) localStorage.removeItem(k); } catch (e) { storageOK = false; } delete mem[k]; }
};
const prefersReduced = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const defaults = () => ({ v: 1, theme: 'dark', anim: prefersReduced ? 'reduced' : 'full', card: 'source', sim: true, favs: [], alerts: [], pf: [] });

function sanitize(o) {
  const d = defaults();
  if (!o || typeof o !== 'object') return d;
  if (['auto', 'light', 'dark'].includes(o.theme)) d.theme = o.theme;
  if (typeof o.sim === 'boolean') d.sim = o.sim;
  if (['full', 'reduced', 'none'].includes(o.anim)) d.anim = o.anim;
  if (['drawn', 'source'].includes(o.card)) d.card = o.card;
  if (Array.isArray(o.favs)) d.favs = [...new Set(o.favs.map(String))];
  if (Array.isArray(o.alerts)) d.alerts = o.alerts.filter((a) => a && a.cid != null && (a.dir === '<=' || a.dir === '>=') && isFinite(a.price))
    .map((a) => ({ id: String(a.id || uid()), cid: String(a.cid), dir: a.dir, price: Number(a.price), trig: !!a.trig, seen: !!a.seen, name: String(a.name || '') }));
  if (Array.isArray(o.pf)) d.pf = o.pf.filter((p) => p && p.id != null && isFinite(p.buy) && p.buy >= 0 && isFinite(p.qty) && p.qty >= 1)
    .map((p) => ({ k: String(p.k || uid()), id: String(p.id), buy: Number(p.buy), qty: Math.floor(Number(p.qty)), t: Number(p.t) || Date.now(), name: String(p.name || '') }));
  return d;
}
let S;
try { S = sanitize(JSON.parse(store.get(KEY) || 'null')); } catch (e) { S = defaults(); }
const save = () => store.set(KEY, JSON.stringify(S));
let FAV = new Set(S.favs);

/* =====================================================================
   Données
   ===================================================================== */
const EMPTY = { demo: false, updatedAt: null, source: 'En attente', cards: [], sbcs: [] };
let DATA = EMPTY, UPCOMING = [], CARDS = [], MAP = new Map(), MOVERS = [], POSLIST = [];
let lastCheck = 0, loadedOnce = false;

const GROUPS = { GK: ['GK'], DEF: ['CB', 'LB', 'RB', 'LWB', 'RWB'], MIL: ['CDM', 'CM', 'CAM', 'LM', 'RM'], ATT: ['LW', 'RW', 'CF', 'ST', 'LF', 'RF', 'LS', 'RS'] };
const GROUP_NAMES = { GK: 'Gardiens', DEF: 'Défenseurs', MIL: 'Milieux', ATT: 'Attaquants' };
const STATK = ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY'];
const POS_RE = /LWB|RWB|GK|CB|LB|RB|CDM|CAM|CM|LM|RM|LW|RW|CF|ST|LF|RF|LS|RS/g;

function prep(c) {
  const price = Number.isFinite(Number(c.price)) && c.price !== null && Number(c.price) > 0 ? Number(c.price) : null;
  const h = Array.isArray(c.history) ? c.history.filter((x) => x && Number.isFinite(Number(x.p))).map((x) => ({ t: Number(x.t) || 0, p: Number(x.p) })) : [];
  const series = h.slice();
  if (price !== null && (!series.length || series[series.length - 1].p !== price)) series.push({ t: Date.parse(DATA.updatedAt) || Date.now(), p: price });
  let chg = null, min = null, max = null, avg = null;
  if (series.length) {
    let sum = 0; min = Infinity; max = -Infinity;
    for (const s of series) { sum += s.p; if (s.p < min) min = s.p; if (s.p > max) max = s.p; }
    avg = sum / series.length;
  }
  if (series.length >= 2) { const a = series[series.length - 2].p, b = series[series.length - 1].p; if (a > 0) chg = (b - a) / a; }
  const st = (c.stats && typeof c.stats === 'object') ? c.stats : {};
  const parts = [...new Set(String(c.pos || '').toUpperCase().match(POS_RE) || [])];
  return {
    id: String(c.id), name: String(c.name || 'Inconnu'), rating: Number(c.rating) || 0, pos: parts.length ? parts.join(', ') : String(c.pos || '').replace(/\+/g, ''), _pos: parts, playerImage: c.playerImageLarge || c.playerImage || '',
    club: String(c.club || ''), nation: String(c.nation || ''), league: String(c.league || ''), stats: st, cardImage: c.cardImageLarge || c.cardImage || '', version: String(c.version || ''), ps: (Array.isArray(c.ps) ? c.ps : []).map(function (x) { return { n: String((x && x.n) || ''), l: safeUrl((x && x.l) || ''), g: !!(x && x.g) }; }).filter(function (x) { return x.l || x.n; }), sm: Number(c.skillMoves) || 0, wf: Number(c.weakFoot) || 0, nationImage: c.nationImage || '', leagueImage: c.leagueImage || '', clubImage: c.clubImage || '',
    price, _series: series, _chg: chg, _min: min, _max: max, _avg: avg,
    _n: norm([c.name, c.club, c.nation, c.league, c.pos].join(' '))
  };
}

function setData(d, u) {
  if (d && Array.isArray(d.cards)) {
    DATA = d;
    CARDS = d.cards.filter((c) => c && c.id != null).map(prep);
    MAP = new Map(CARDS.map((c) => [c.id, c]));
    MOVERS = CARDS.filter((c) => c._chg != null && c.price != null && c._chg !== 0)
      .sort((a, b) => Math.abs(b._chg) - Math.abs(a._chg)).slice(0, 14);
    POSLIST = [...new Set(CARDS.flatMap((c) => c._pos))].sort();
  }
  if (u && Array.isArray(u.sbcs)) UPCOMING = u.sbcs.filter((x) => x && typeof x === 'object' && x.name);
}

async function getJSON(url) {
  const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadAll() {
  lastCheck = Date.now();
  let d = null, u = null;
  try { d = await getJSON('data.json'); } catch (e) { /* ouverture en fichier ou aperçu : données vides */ }
  try { u = await getJSON('sbcs.json'); } catch (e) { }
  const first = !loadedOnce;
  loadedOnce = true;
  const changed = first || (d && (d.updatedAt !== DATA.updatedAt || (d.cards || []).length !== CARDS.length)) || (u && JSON.stringify(u.sbcs) !== JSON.stringify(UPCOMING));
  if (!changed) return;
  setData(d, u);
  afterData();
}

function afterData() {
  buildPosFilter();
  renderHeader();
  renderTicker();
  renderMarket();
  checkAlerts();
  renderActive();
  if (!$('#sheet').hidden) renderSheet();
}

/* =====================================================================
   Dates
   ===================================================================== */
function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 0);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
const fmtDate = (d) => p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear();
const fmtDT = (d) => p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
function countdown(d) {
  if (!d) return '';
  const ms = d - Date.now();
  if (ms < 0) return 'terminé';
  const h = Math.floor(ms / 36e5), j = Math.floor(h / 24);
  if (j >= 2) return 'dans ' + j + ' jours';
  if (j === 1) return 'dans 1 jour';
  if (h >= 1) return 'dans ' + h + ' h';
  return 'dans moins d\'1 h';
}

/* =====================================================================
   Morceaux d'affichage
   ===================================================================== */
// Texte posé sur la carte : note, poste, nom, stats (le fond et la photo ne changent pas).
// Drapeaux : si le robot n'a pas d'image de pays, on prend le drapeau du pays sur flagcdn.com (service gratuit de drapeaux).
const ISO = {
  'afghanistan':'af','albania':'al','algeria':'dz','angola':'ao','argentina':'ar','armenia':'am','australia':'au','austria':'at','azerbaijan':'az','belgium':'be','benin':'bj','bolivia':'bo','bosnia and herzegovina':'ba','bosnia-herzegovina':'ba','brazil':'br','bulgaria':'bg','burkina faso':'bf','cameroon':'cm','canada':'ca','cape verde':'cv','cabo verde':'cv','central african republic':'cf','chad':'td','chile':'cl','china':'cn','china pr':'cn','colombia':'co','comoros':'km','congo':'cg','congo dr':'cd','dr congo':'cd','costa rica':'cr',"cote d'ivoire":'ci',"côte d'ivoire":'ci','ivory coast':'ci','croatia':'hr','cuba':'cu','curacao':'cw','curaçao':'cw','cyprus':'cy','czech republic':'cz','czechia':'cz','denmark':'dk','dominican republic':'do','ecuador':'ec','egypt':'eg','el salvador':'sv','england':'gb-eng','equatorial guinea':'gq','estonia':'ee','finland':'fi','france':'fr','gabon':'ga','gambia':'gm','georgia':'ge','germany':'de','ghana':'gh','greece':'gr','guinea':'gn','guinea-bissau':'gw','haiti':'ht','honduras':'hn','hungary':'hu','iceland':'is','india':'in','indonesia':'id','iran':'ir','iraq':'iq','ireland':'ie','republic of ireland':'ie','israel':'il','italy':'it','jamaica':'jm','japan':'jp','jordan':'jo','kazakhstan':'kz','kenya':'ke','korea republic':'kr','south korea':'kr','korea dpr':'kp','kosovo':'xk','kuwait':'kw','latvia':'lv','lebanon':'lb','liberia':'lr','libya':'ly','lithuania':'lt','luxembourg':'lu','madagascar':'mg','mali':'ml','malta':'mt','mauritania':'mr','mexico':'mx','moldova':'md','montenegro':'me','morocco':'ma','mozambique':'mz','netherlands':'nl','holland':'nl','new zealand':'nz','nicaragua':'ni','niger':'ne','nigeria':'ng','north macedonia':'mk','macedonia':'mk','northern ireland':'gb-nir','norway':'no','panama':'pa','paraguay':'py','peru':'pe','philippines':'ph','poland':'pl','portugal':'pt','qatar':'qa','romania':'ro','russia':'ru','rwanda':'rw','saudi arabia':'sa','scotland':'gb-sct','senegal':'sn','serbia':'rs','sierra leone':'sl','slovakia':'sk','slovenia':'si','south africa':'za','spain':'es','sudan':'sd','suriname':'sr','sweden':'se','switzerland':'ch','syria':'sy','tanzania':'tz','thailand':'th','togo':'tg','trinidad and tobago':'tt','tunisia':'tn','turkey':'tr','türkiye':'tr','turkiye':'tr','uganda':'ug','ukraine':'ua','united arab emirates':'ae','united states':'us','usa':'us','uruguay':'uy','uzbekistan':'uz','venezuela':'ve','vietnam':'vn','wales':'gb-wls','zambia':'zm','zimbabwe':'zw',
  'allemagne':'de','espagne':'es','italie':'it','angleterre':'gb-eng','pays-bas':'nl','belgique':'be','suisse':'ch','autriche':'at','danemark':'dk','norvège':'no','suède':'se','pologne':'pl','croatie':'hr','serbie':'rs','maroc':'ma','algérie':'dz','tunisie':'tn','égypte':'eg','sénégal':'sn','cameroun':'cm','brésil':'br','argentine':'ar','états-unis':'us','japon':'jp','corée du sud':'kr','écosse':'gb-sct','pays de galles':'gb-wls','irlande':'ie','turquie':'tr','grèce':'gr','république tchèque':'cz'
};
function flagUrl(name) {
  const k = String(name || '').trim().toLowerCase();
  const c = ISO[k];
  return c ? 'https://flagcdn.com/w80/' + c + '.png' : '';
}
function ovHtml(c) {
  const st = STATK.map((k) => (c.stats[k] != null && c.stats[k] !== '') ? '<div><i>' + k + '</i><b>' + esc(c.stats[k]) + '</b></div>' : '').join('');
  const im = (u) => safeUrl(u) ? '<img data-face="1" loading="lazy" referrerpolicy="no-referrer" alt="" src="' + esc(safeUrl(u)) + '">' : '';
  const it = (u, t) => safeUrl(u) ? im(u) : (t ? '<em>' + esc(String(t).replace(/[^\p{L}\p{N}]/gu, '').slice(0, 3).toUpperCase()) + '</em>' : '');
  const bd = it(c.nationImage || flagUrl(c.nation), c.nation) + it(c.leagueImage, c.league) + it(c.clubImage, c.club);
  return '<span class="ov"><span class="r">' + esc(c.rating || '?') + '</span><span class="p">' + esc(c._pos[0] || '') + '</span>' +
    (c.sm && c.wf ? '<span class="sw">' + c.sm + '•' + c.wf + '</span>' : '') + '<span class="n">' + esc(c.name) + '</span>' + (st ? '<span class="s">' + st + '</span>' : '') + (bd ? '<span class="bd">' + bd + '</span>' : '') + '</span>';
}
function drawnCard(c, size) {
  const f = safeUrl(c.playerImage);
  const tier = c.rating >= 75 ? '' : c.rating >= 65 ? ' silver' : ' bronze';
  const sil = '<svg viewBox="0 0 40 48" aria-hidden="true"><circle cx="20" cy="14" r="9"/><path d="M3 48c0-12 7-20 17-20s17 8 17 20z"/></svg>';
  const st = STATK.map((k) => (c.stats[k] != null && c.stats[k] !== '') ? '<div><b>' + esc(c.stats[k]) + '</b><i>' + k + '</i></div>' : '').join('');
  return '<span class="fc' + tier + ' ' + size + '"><span class="fc-r">' + esc(c.rating || '?') + '</span><span class="fc-p">' + esc(c._pos[0] || '') + '</span>' +
    '<span class="fc-ph">' + sil + (f ? '<img src="' + esc(f) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-face="1">' : '') + '</span>' +
    '<span class="fc-n">' + esc(c.name) + '</span>' + (st ? '<span class="fc-s">' + st + '</span>' : '') +
    '<span class="fc-b"><span>' + esc(c.nation.slice(0, 3)) + '</span><span>' + esc(c.club.slice(0, 3)) + '</span></span></span>';
}
function cardImg(c, size) {
  if (S.card === 'drawn') return drawnCard(c, size);
  const u = safeUrl(c.cardImage);
  if (!u) return '<span class="cardbox fb ' + size + '"><b>' + esc(c.rating || '?') + '</b></span>';
  const f = safeUrl(c.playerImage);
  // Grande carte : on essaie des versions plus grandes du même fond (plus nettes), puis l'original en dernier recours.
  let first = u, alts = '';
  if (size !== 'sm') {
    const q = u.split('?')[0];
    const cand = [q.replace('/cards/tiny/', '/cards/large/'), q.replace('/cards/tiny/', '/cards/big/'), q, u].filter((x, i, a2) => a2.indexOf(x) === i);
    first = cand[0]; alts = cand.slice(1).join(' ');
  }

// Netteté : le fond de la source est minuscule (64 px). On l'agrandit en plusieurs étapes avec lissage,
// puis on accentue légèrement les bords. Résultat gardé en mémoire (le même fond sert à beaucoup de cartes).
const UP = new Map();
function upscale(img) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  if (!w0 || !h0 || w0 >= 300) return null;
  let src = img, w = w0, h = h0;
  const tw = Math.min(Math.round(w0 * 5), 360);
  while (w < tw) {
    const nw = Math.min(w * 2, tw), nh = Math.round(h * nw / w);
    const c = document.createElement('canvas'); c.width = nw; c.height = nh;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    x.drawImage(src, 0, 0, nw, nh); src = c; w = nw; h = nh;
  }
  const ctx = src.getContext('2d');
  const d = ctx.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a);
  const k = 0.45;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = (y * w + x) * 4;
    if (a[i + 3] < 8) continue;
    for (let ch = 0; ch < 3; ch++) {
      const j = i + ch;
      const v = a[j] * (1 + 4 * k) - k * (a[j - 4] + a[j + 4] + a[j - w * 4] + a[j + w * 4]);
      o[j] = v;
    }
  }
  d.data.set(o); ctx.putImageData(d, 0, 0);
  return src.toDataURL('image/png');
}
// Fond clair (ex. cartes blanches) : le texte passe en noir. On mesure la luminosité du bas de la carte.
function tone(img) {
  const c = document.createElement('canvas'); c.width = 8; c.height = 8;
  const x = c.getContext('2d');
  x.drawImage(img, 0, img.naturalHeight * 0.55, img.naturalWidth, img.naturalHeight * 0.4, 0, 0, 8, 8);
  const d = x.getImageData(0, 0, 8, 8).data; let R = 0, G = 0, B = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { if (d[i + 3] > 100) { R += d[i]; G += d[i + 1]; B += d[i + 2]; n++; } }
  if (!n) return '';
  R /= n; G /= n; B /= n;
  const lum = R * 0.3 + G * 0.59 + B * 0.11, sat = Math.max(R, G, B) - Math.min(R, G, B);
  return lum >= 120 ? 'lt' : sat > 40 ? 'gd' : 'cr';
}
document.addEventListener('load', (e) => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG' || !t.classList.contains('bg')) return;
  if (!t.dataset.lum && t.naturalWidth) {
    t.dataset.lum = '1';
    const box = t.parentNode;
    if (box) {
      box.style.aspectRatio = t.naturalWidth + ' / ' + t.naturalHeight; // le cadre prend la forme exacte de la carte
      let k = ''; try { k = tone(t); } catch (err) { k = /icon|hero/i.test(t.currentSrc || t.src) ? 'lt' : ''; }
      if (k) box.classList.add(k);
    }
  }
  if (t.dataset.up) return;
  const key = t.currentSrc || t.src;
  if (UP.has(key)) { const v = UP.get(key); if (v) { t.dataset.up = '1'; t.src = v; } return; }
  let v = null;
  try { v = upscale(t); } catch (err) { v = null; }
  UP.set(key, v);
  if (v) { t.dataset.up = '1'; t.src = v; }
}, true);
// Si le fond ne charge pas : cadre gris avec la note. Si la photo ne charge pas : on l'enlève, le fond reste seul.
document.addEventListener('error', (e) => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG' || !t.dataset || !t.parentNode) return;
  if (t.dataset.face) { t.remove(); return; }
  if (t.dataset.alts) { const l = t.dataset.alts.split(' '); const o = l.shift(); if (l.length) t.dataset.alts = l.join(' '); else delete t.dataset.alts; t.src = o; return; }
  // Toutes les adresses ont échoué avec l'accès avancé (netteté) : on recommence une fois sans, comme avant.
  if (t.hasAttribute('crossorigin') && t.dataset.all) { t.removeAttribute('crossorigin'); const l = t.dataset.all.split(' '); t.dataset.all = ''; const o = l.shift(); t.dataset.alts = l.join(' '); if (!l.length) delete t.dataset.alts; t.src = o; return; }
  if (t.dataset.r !== undefined) {
    const box = t.parentNode; box.classList.add('fb'); box.innerHTML = '<b>' + esc(t.dataset.r) + '</b>';
  }
}, true);

const M = { q: '', pos: '', minR: 0, maxP: '', sort: 'price-desc', fav: false, page: 1 };

function buildPosFilter() {

function posMatch(c, f) { return f.startsWith('g:') ? c._pos.some((q) => GROUPS[f.slice(2)].includes(q)) : c._pos.includes(f); }

function filtered() {
  const q = norm(M.q).trim();
  const max = M.maxP === '' ? null : Number(M.maxP);
  const a = CARDS.filter((c) => {
    if (q && !c._n.includes(q)) return false;
    if (M.pos && !posMatch(c, M.pos)) return false;
    if (c.rating < M.minR) return false;
    if (max !== null && (c.price == null || c.price > max)) return false;
    if (M.fav && !FAV.has(c.id)) return false;
    return true;
  });
  const nl = (f, dir) => (x, y) => { // valeurs vides toujours à la fin
    const A = f(x), B = f(y);
    if (A == null && B == null) return 0; if (A == null) return 1; if (B == null) return -1;
    return dir * (A - B);
  };
  const [k, dir] = M.sort.split('-');
  if (k === 'price') a.sort(nl((c) => c.price, dir === 'asc' ? 1 : -1));
  else if (k === 'rating') a.sort((x, y) => y.rating - x.rating || (y.price || 0) - (x.price || 0));
  else if (k === 'chg') a.sort(nl((c) => c._chg, dir === 'asc' ? 1 : -1));
  else a.sort((x, y) => x.name.localeCompare(y.name, 'fr'));
  return a;
}

/* =====================================================================
   SBC : fusion « en cours » (robot) + « à venir » (sbcs.json)
   ===================================================================== */
const skey = (n) => norm(n).replace(/[^a-z0-9]+/g, ' ').trim();
function cleanReqs(r) {
  return (Array.isArray(r) ? r : []).map((x) => ({ minRating: Number(x && x.minRating), count: Math.floor(Number(x && x.count)) }))
    .filter((x) => x.minRating >= 40 && x.minRating <= 99 && x.count >= 1);
}
function buildSbcs() {
  const now = Date.now();
  const ups = new Map();
  for (const u of UPCOMING) { const k = skey(u.name); if (k && !ups.has(k)) ups.set(k, u); }
  const seen = new Set(), cur = [], up = [];
  for (const s of (DATA.sbcs || [])) {
    if (!s || !s.name) continue;
    const k = skey(s.name); if (!k || seen.has(k)) continue; seen.add(k);
    const d = parseDate(s.expires);
    if (d && d.getTime() < now) continue; // déjà terminé
    const u = ups.get(k);
    cur.push({ kind: 'cur', name: String(s.name), date: d, rawDate: String(s.expires || ''), url: safeUrl(s.url) || (u ? safeUrl(u.sourceUrl) : ''), reward: String(s.reward || ''),
      official: u ? !!u.official : true, reqs: u ? cleanReqs(u.requirements) : [], note: u ? String(u.note || '') : '' });
  }
  for (const [k, u] of ups) {
    if (seen.has(k)) continue;
    const d = parseDate(u.expectedDate);
    if (d && d.getTime() < now - 864e5) continue; // date passée
    up.push({ kind: 'up', name: String(u.name), date: d, rawDate: String(u.expectedDate || ''), url: safeUrl(u.sourceUrl), reward: '', official: !!u.official, reqs: cleanReqs(u.requirements), note: String(u.note || '') });
  }
  const bydate = (a, b) => (a.date ? a.date.getTime() : 9e15) - (b.date ? b.date.getTime() : 9e15);
  cur.sort(bydate); up.sort(bydate);
  return { cur, up };
}
const reqText = (r) => r.count + ' carte' + (r.count > 1 ? 's' : '') + ' de note ' + r.minRating + '+';

function sbcBlock(s) {

  const badge = s.kind === 'up' ? (s.official ? '<span class="badge hi">Officiel</span>' : '<span class="badge lo">Non officiel</span>') : '';

   ===================================================================== */
function advice(s, req) {
  const days = s.date ? (s.date.getTime() - Date.now()) / 864e5 : null;
  const up = Math.min(0.12, 0.02 * req.count) + (days != null && days >= 0 && days <= 3 ? 0.03 : 0);
  const out = [];
  for (const c of CARDS) {
    if (c.price == null || c.price < 150 || c._series.length < 2) continue;
    if (c.rating !== req.minRating && c.rating !== req.minRating + 1) continue;
    if (!(c.price < c._avg * 0.97)) continue;
    const target = c._avg * (1 + up);
    const gain = target * (1 - TAX) - c.price;
    if (gain <= 0) continue;
    const disc = (c._avg - c.price) / c._avg;
    let sd = 0; for (const p of c._series) sd += (p.p - c._avg) * (p.p - c._avg);
    const cv = Math.sqrt(sd / c._series.length) / c._avg;
    const conf = Math.max(0, Math.min(100, Math.round(
      30 * Math.min(1, c._series.length / 14) + 25 * Math.min(1, disc / 0.15) +
      25 * (days == null ? 0.3 : days <= 7 ? 1 : days <= 21 ? 0.6 : 0.3) + 20 * (1 - Math.min(1, cv / 0.2)))));
    out.push({ c, gain, gainPct: gain / c.price, conf, target });
  }
  out.sort((a, b) => b.gain - a.gain);
  return out.slice(0, 8);
}
const confBadge = (n) => '<span class="badge ' + (n >= 65 ? 'hi' : n >= 40 ? 'mid' : 'lo') + '">Confiance ' + (n >= 65 ? 'élevée' : n >= 40 ? 'moyenne' : 'faible') + ' (' + n + '/100)</span>';

function simSeries(c, per) {

function chartGeo(sr) {

function smoothPath(pts) {

  for (let i = 0; i < n - 1; i++) {

    '<label class="l" for="setSim">Courbe de prix simulée (démonstration)</label><select class="field" id="setSim"><option value="1">Oui, historique simulé</option><option value="0">Non, vrais relevés du robot</option></select></div>' +
    '<h2>Mes données</h2><div class="box">' +
    (storageOK ? '' : '<div class="note" style="margin-top:0">Ton navigateur bloque la sauvegarde : tes favoris, alertes et portefeuille seront perdus à la fermeture. Pense à faire une sauvegarde.</div>') +
    '<p class="small muted" style="margin-top:0">Favoris, alertes et portefeuille restent sur cet appareil. Fais une sauvegarde avant de changer de téléphone ou de vider ton navigateur.</p>' +
    '<div class="row2"><button class="btn primary" data-act="export">Télécharger ma sauvegarde</button><label class="btn" style="display:inline-block">Restaurer un fichier<input type="file" id="importFile" accept="application/json,.json" hidden></label></div>' +
    '<details style="margin-top:10px"><summary class="small">Sauvegarde en texte (copier / coller)</summary><textarea class="field" id="bkText" rows="5" style="margin-top:6px" placeholder="Colle ici une sauvegarde"></textarea>' +
    '<div class="row2" style="margin-top:6px"><button class="btn" data-act="showtext">Afficher mon texte</button><button class="btn" data-act="restoretext">Restaurer ce texte</button></div></details></div>' +
    '<h2>Remise à zéro</h2><div class="box"><p class="small muted" style="margin-top:0">Efface tes favoris, alertes, portefeuille et réglages sur cet appareil. Les prix ne sont pas touchés.</p><button class="btn danger" data-act="reset">Tout remettre à zéro</button></div>' +
    '<h2>À propos</h2><div class="box small muted">Dernière mise à jour des prix : <b>' + (d && !isNaN(d) ? fmtDT(d) : 'aucune') + '</b><br>Cartes : <b>' + fmt(CARDS.length) + '</b> · Source : ' + esc(DATA.source || '—') +
    '<br><br>Les prix ne sont pas en temps réel (jusqu\'à environ 2 jours de retard). Les gains et conseils sont des estimations. Application non officielle, sans lien avec EA.</div>';
  $('#setCard').value = S.card; $('#setSim').value = S.sim ? '1' : '0'; $('#setTheme').value = S.theme; $('#setAnim').value = S.anim;
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function restore(text) {
  let o; try { o = JSON.parse(text); } catch (e) { toast('Ce texte n\'est pas une sauvegarde valide'); return; }
  if (!o || typeof o !== 'object' || !('favs' in o || 'alerts' in o || 'pf' in o)) { toast('Ce n\'est pas une sauvegarde FC27 Companion'); return; }
  S = sanitize(o); FAV = new Set(S.favs); save(); applyLook(); checkAlerts(); renderMarket(); renderActive();
  toast('Sauvegarde restaurée');
}

/* =====================================================================
   Thème, animations, navigation
   ===================================================================== */
function applyLook() {
  let t = S.theme;
  if (t === 'auto') { try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; } }
  document.documentElement.dataset.theme = t;
  document.documentElement.dataset.anim = S.anim;
  $('#metaTheme').setAttribute('content', t === 'dark' ? '#0a0c11' : '#f4f6f8');
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3500); }

let TAB = 0;
const RENDER = [renderMarket, renderTips, renderSbc, renderPortfolio, renderSettings];
function renderActive() { if (TAB !== 0) RENDER[TAB](); }
function showTab(i) {
  const prev = TAB; TAB = i;
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(+b.dataset.tab === i)));
  $('#ind').style.setProperty('--i', i);
  document.querySelectorAll('.page').forEach((p, k) => {
    p.classList.toggle('active', k === i);
    p.classList.remove('from-r', 'from-l');
    if (k === i && i !== prev) p.classList.add(i > prev ? 'from-r' : 'from-l');
  });
  if (i !== 0) RENDER[i]();
  window.scrollTo(0, 0);
}

/* =====================================================================
   Événements
   ===================================================================== */
document.addEventListener('click', (e) => {
  const tab = e.target.closest('#tabs button'); if (tab) { showTab(+tab.dataset.tab); return; }
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'open': openSheet(id); break;
    case 'close': closeSheet(); break;
    case 'cperiod': { CHP = el.dataset.p; const c = MAP.get(CURID); if (c) $('#chartBox').innerHTML = chartBoxHtml(c); break; }
    case 'fav': {
      if (FAV.has(id)) FAV.delete(id); else FAV.add(id);
      S.favs = [...FAV]; save();
      if (!$('#sheet').hidden) renderSheet();
      renderMarket(); if (TAB === 3) renderPortfolio();
      break;
    }
    case 'pg': M.page += Number(el.dataset.d); renderMarket(); window.scrollTo(0, 0); break;
    case 'addalert': {
      const v = num($('#alPrice').value);
      if (v == null || v <= 0) { toast('Entre un montant plus grand que 0'); break; }
      const c = MAP.get(id);
      S.alerts.push({ id: uid(), cid: id, dir: $('#alDir').value === '>=' ? '>=' : '<=', price: Math.round(v), trig: false, seen: true, name: c ? c.name : '' });
      save(); if (!checkAlerts()) toast('Alerte créée'); renderSheet();
      break;
    }
    case 'delalert': S.alerts = S.alerts.filter((a) => a.id !== id); save(); updateDot(); if (!$('#sheet').hidden) renderSheet(); if (TAB === 3) renderPortfolio(); break;
    case 'rearm': { const a = S.alerts.find((x) => x.id === id); if (a) { a.trig = false; a.seen = true; save(); updateDot(); renderPortfolio(); } break; }
    case 'addpos': {
      const buy = num($('#pfBuy').value), q = Math.floor(num($('#pfQty').value) || 0);
      if (buy == null || buy < 0 || q < 1) { toast('Entre un prix d\'achat et une quantité (1 ou plus)'); break; }
      const c = MAP.get(id);
      S.pf.push({ k: uid(), id, buy: Math.round(buy), qty: q, t: Date.now(), name: c ? c.name : '' });
      save(); toast('Ajouté au portefeuille');
      break;
    }
    case 'delpos': S.pf = S.pf.filter((p) => p.k !== el.dataset.k); save(); renderPortfolio(); break;
    case 'export': download('fc27-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(S, null, 1)); break;
    case 'showtext': $('#bkText').value = JSON.stringify(S); break;
    case 'restoretext': restore($('#bkText').value); break;
    case 'reset':
      if (confirm('Tout effacer (favoris, alertes, portefeuille, réglages) sur cet appareil ?')) {
        S = defaults(); FAV = new Set(); store.del(KEY); applyLook(); updateDot(); renderMarket(); renderSettings(); toast('Données remises à zéro');
      }
      break;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'setTheme') { S.theme = t.value; save(); applyLook(); }
  else if (t.id === 'setAnim') { S.anim = t.value; save(); applyLook(); }
  else if (t.id === 'setSim') { S.sim = t.value === '1'; save(); if (!$('#sheet').hidden) renderSheet(); }
  else if (t.id === 'setCard') { S.card = t.value; save(); renderMarket(); renderActive(); }
  else if (t.id === 'importFile' && t.files && t.files[0]) {
    const r = new FileReader(); r.onload = () => restore(String(r.result)); r.onerror = () => toast('Lecture du fichier impossible'); r.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

let qT;
$('#q').addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => { M.q = e.target.value; M.page = 1; renderMarket(); }, 180); });
$('#fPos').addEventListener('change', (e) => { M.pos = e.target.value; M.page = 1; renderMarket(); });
$('#fRat').addEventListener('change', (e) => { M.minR = Number(e.target.value); M.page = 1; renderMarket(); });
$('#fMax').addEventListener('input', (e) => { const v = num(e.target.value); M.maxP = v == null || v <= 0 ? '' : v; M.page = 1; renderMarket(); });
$('#fSort').addEventListener('change', (e) => { M.sort = e.target.value; M.page = 1; renderMarket(); });
$('#fFav').addEventListener('click', (e) => { M.fav = !M.fav; e.currentTarget.setAttribute('aria-pressed', String(M.fav)); M.page = 1; renderMarket(); });

// Mise à jour seulement quand la page est visible
function maybeRefresh() { if (document.visibilityState === 'visible' && Date.now() - lastCheck > REFRESH) loadAll(); }
document.addEventListener('visibilitychange', maybeRefresh);
setInterval(maybeRefresh, 60e3);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') applyLook(); }); } catch (e) { }

/* =====================================================================
   Démarrage
   ===================================================================== */
applyLook();
$('#p0').classList.add('active');
// Pièce perso : si tu ajoutes un fichier coin.png à côté de index.html, il remplace la pièce dessinée.
try { const ci = new Image(); ci.onload = () => document.documentElement.classList.add('customcoin'); ci.src = 'coin.png'; } catch (e) { }
renderHeader(); renderMarket(); updateDot();
loadAll();
})();
</script>
</body>
</html>
