<!doctype html>
<html lang="fr" data-theme="dark" data-anim="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11" id="metaTheme">
<title>FC27 Companion</title>
<style>
:root{
  --bg:#f4f6f8;--surface:#ffffff;--surface2:#eaeef2;--text:#141a22;--muted:#5b6673;--line:#d9dfe6;
  --accent:#2563eb;--accent-text:#ffffff;--up:#0f8a4b;--down:#c62828;--warn:#9a6700;
  --ease:cubic-bezier(.4,0,.2,1);--tpage:.28s;--tind:.38s;--tsheet:.28s;
  --nav-h:62px;
}
[data-theme=dark]{
  --bg:#0a0c11;--surface:#13161d;--surface2:#1d212b;--text:#f1f3f7;--muted:#8d96a6;--line:#242a35;
  --accent:#3ddc84;--accent-text:#04140b;--up:#3ddc84;--down:#ff5d5d;--warn:#f0b429;
}
[data-anim=reduced]{--tpage:.12s;--tind:.12s;--tsheet:.12s}
[data-anim=none]{--tpage:0s;--tind:0s;--tsheet:0s}
[data-anim=none] *,[data-anim=none] *::before,[data-anim=none] *::after{animation:none!important;transition:none!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto}

/* ---------- haut de page ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
.top .wrap{display:flex;flex-direction:column;gap:2px}
.brand{font-weight:900;font-size:20px;letter-spacing:.5px;text-transform:uppercase}
.brand::before{content:"";display:inline-block;width:10px;height:18px;border-radius:3px;background:var(--accent);margin-right:8px;vertical-align:-2px;transform:skewX(-12deg)}
.upd{font-size:12.5px;color:var(--muted)}
.upd b{color:var(--text);font-weight:600}

main{padding:10px 12px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
.page{display:none}
.page.active{display:block;animation:pgin var(--tpage) var(--ease) both}
[data-anim=reduced] .page{--dx:0px!important}
@keyframes pgin{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
.page.from-r{--dx:26px}.page.from-l{--dx:-26px}

h2{font-size:17px;margin:14px 2px 8px}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin:8px 0}
.empty{text-align:center;padding:36px 16px}
.empty .big{font-size:18px;font-weight:700;margin-bottom:6px}
pre{background:var(--surface2);border-radius:10px;padding:10px;overflow:auto;font-size:12px;white-space:pre-wrap}

/* ---------- boutons et champs ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--down);border-color:var(--down)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:40px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.controls .full{grid-column:1/-1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-weight:600;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- cartes (image de la source, rien dessus) ---------- */
/* Photo du joueur posée sur le fond de carte. Pour la déplacer ou la grossir, change ces 3 nombres :
   --fx = distance depuis la gauche, --fy = distance depuis le haut, --fw = largeur (en % de la carte). */
.cardbox{display:block;flex:none;aspect-ratio:3/4;position:relative;container-type:inline-size;--fx:30%;--fy:13%;--fw:62%}
.cardbox .face{position:absolute;left:var(--fx);top:var(--fy);width:var(--fw);height:auto;object-fit:contain;pointer-events:none}
.cardbox img.bg{display:block;width:100%;height:100%;object-fit:contain}
.ov{position:absolute;inset:0;color:#fff;text-shadow:0 0 2px #000,0 0 3px #000,0 1px 4px rgba(0,0,0,.8);pointer-events:none}
.ov .r{position:absolute;left:14%;top:10%;font-weight:800;font-size:16cqw;line-height:1}
.ov .p{position:absolute;left:14%;top:26%;font-weight:700;font-size:8cqw;line-height:1}
.ov .n{position:absolute;left:5%;right:5%;top:61%;text-align:center;font-weight:800;font-size:8.5cqw;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .s{position:absolute;left:14%;right:14%;top:72%;display:grid;grid-template-columns:repeat(6,1fr);text-align:center}
.ov .s b{display:block;font-size:8cqw;line-height:1.1}
.ov .s i{display:block;font-style:normal;font-size:5cqw;font-weight:700;opacity:.8}
.cardbox.sm{width:50px}
.cardbox.md{width:min(150px,80%)}
.cardbox.lg{width:132px}
.cardbox.fb{background:#9aa0a6;display:flex;align-items:center;justify-content:center}
.cardbox.fb b{font-size:20px;color:#fff}
.cardbox.lg.fb b{font-size:36px}

/* ---------- carte dessinée par l'appli (design à nous, nette à toute taille) ---------- */
.fc{--c1:#f4e3a1;--c2:#cfa23a;--c3:#7d5a14;--ink:#2a1f06;container-type:inline-size;position:relative;display:block;flex:none;aspect-ratio:5/7;border-radius:12% / 8.5%;overflow:hidden;
  background:radial-gradient(120% 80% at 30% 0%,var(--c1),var(--c2) 55%,var(--c3));color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(255,255,255,.35)}
.fc::before{content:"";position:absolute;inset:3.5%;border-radius:10% / 7%;border:1px solid rgba(255,255,255,.4);pointer-events:none}
.fc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);pointer-events:none}
.fc.silver{--c1:#f3f5f8;--c2:#b6bec9;--c3:#6a7381;--ink:#1c222a}
.fc.bronze{--c1:#f1cba3;--c2:#b97a45;--c3:#6a3c18;--ink:#2c1704}
.fc.sm{width:54px}.fc.md{width:min(150px,80%)}.fc.lg{width:150px}
.fc-r{position:absolute;left:10%;top:8%;font-weight:800;font-size:21cqw;line-height:1}
.fc-p{position:absolute;left:10%;top:30%;font-weight:700;font-size:8.5cqw;line-height:1}
.fc-ph{position:absolute;right:4%;top:5%;width:72%;height:56%;display:flex;align-items:flex-end;justify-content:center}
.fc-ph img{position:absolute;bottom:0;max-width:100%;max-height:100%;object-fit:contain;object-position:bottom}
.fc-ph svg{width:80%;height:100%;opacity:.25;fill:currentColor}
.fc-n{position:absolute;left:6%;right:6%;top:62%;text-align:center;font-weight:800;font-size:9cqw;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2.5cqw;border-bottom:1px solid rgba(0,0,0,.22)}
.fc-s{position:absolute;left:10%;right:10%;top:73%;display:grid;grid-template-columns:repeat(6,1fr);text-align:center}
.fc-s b{display:block;font-size:9cqw;line-height:1.1}
.fc-s i{display:block;font-style:normal;font-size:6cqw;font-weight:700;opacity:.75}
.fc-b{position:absolute;left:8%;top:40%;width:19%;display:flex;flex-direction:column;gap:6%;font-size:5.6cqw;font-weight:800;text-transform:uppercase;text-align:center}
.fc-b span{white-space:nowrap;overflow:hidden;background:rgba(0,0,0,.14);border-radius:3cqw;padding:1.5cqw 0}
.fc.sm .fc-n,.fc.sm .fc-s,.fc.sm .fc-b,.fc.sm .fc-p{display:none}
.fc.sm .fc-r{font-size:30cqw}

/* ---------- bandeau ---------- */
.tk{overflow-x:auto;overflow-y:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;scrollbar-width:none}
.tk::-webkit-scrollbar{display:none}
.tk-track{display:flex;width:max-content}
.tk-set{display:flex;gap:6px;padding:8px 6px}
.tk-dup{display:none}
[data-anim=full] .tk{overflow:hidden}
[data-anim=full] .tk-dup{display:flex}
[data-anim=full] .tk-track{animation:tk 45s linear infinite}
[data-anim=full] .tk:active .tk-track,[data-anim=full] .tk:hover .tk-track{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
.tk button{border:0;background:var(--surface2);border-radius:10px;padding:6px 10px;white-space:nowrap;font-size:13px}

/* ---------- liste ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;background:linear-gradient(180deg,var(--surface2),var(--surface) 60%);border:1px solid var(--line);border-radius:14px;min-width:0;transition:transform .15s var(--ease),border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.open{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:0;background:none;padding:12px 6px 10px;width:100%;min-width:0}
.nm{font-weight:700;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .rt{font-weight:600;color:var(--muted);margin-left:4px}
.sub{font-size:11.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg{display:grid;grid-template-columns:repeat(6,1fr);width:100%;gap:2px;margin-top:2px}
.sg div{text-align:center;line-height:1.15}
.sg b{display:block;font-size:13px;font-weight:800}
.sg i{display:block;font-style:normal;font-size:9.5px;color:var(--muted);font-weight:600}
.stats{font-size:10.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-weight:800;font-size:16px;color:var(--warn);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:5px}
.coin{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e0a800 70%);flex:none}
.chg{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}.fl{color:var(--muted)}
.star{position:absolute;top:4px;right:4px;width:36px;height:36px;border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.star[aria-pressed=true]{color:#e0a800}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--surface2)}
.badge.hi{background:var(--up);color:#fff}.badge.mid{background:var(--warn);color:#fff}.badge.lo{background:var(--muted);color:var(--bg)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}

/* ---------- barre du bas ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{position:relative;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
nav button[aria-selected=true]{color:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#ind{position:absolute;top:0;left:0;width:20%;height:3px;display:flex;justify-content:center;transform:translateX(calc(var(--i,0)*100%));transition:transform var(--tind) var(--ease);pointer-events:none}
#ind::after{content:"";width:34px;height:3px;border-radius:3px;background:var(--accent)}
.dot{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--down);display:none}
.dot.on{display:block}

/* ---------- fiche détaillée ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);animation:fade var(--tsheet) var(--ease)}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 20px);animation:up var(--tsheet) var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
[data-anim=reduced] .panel{animation-name:fade}
.panel{position:relative}
.head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-top:4px}
.head .info{width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.head h2{margin:0;font-size:22px}
.head .cardbox.lg,.head .fc.lg{width:min(190px,52vw)}
.close{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;font-size:18px;flex:none;z-index:2}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips span{background:var(--surface2);border-radius:20px;padding:3px 10px;font-size:12.5px;color:var(--muted);font-weight:600}
.big-price{font-size:28px;font-weight:800;color:var(--warn);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.big-price .coin{width:20px;height:20px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.sgrid div{background:var(--surface2);border-radius:10px;padding:6px 8px;text-align:center}
.sgrid b{display:block;font-size:17px}
.sgrid span{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-top:6px}
.tri div{background:var(--surface2);border-radius:10px;padding:6px}
.tri b{display:block;font-variant-numeric:tabular-nums}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;z-index:80;max-width:90%;font-size:14px;animation:fade var(--tsheet) var(--ease)}
.toast[hidden]{display:none}
label.l{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">FC27 Companion</div>
  <div class="upd" id="upd">En attente des premiers prix</div>
  <div class="upd">Prix non temps réel : jusqu'à environ 2 jours de retard.</div>
</div></header>

<main class="wrap" id="main">
  <section class="page" id="p0" aria-label="Marché">
    <div id="mkEmpty" hidden></div>
    <div id="mkBody">
      <div id="tickerBox"></div>
      <div class="controls">
        <input class="field full" id="q" type="search" placeholder="Rechercher un joueur, un club…" autocomplete="off" aria-label="Rechercher">
        <select class="field" id="fPos" aria-label="Poste"></select>
        <select class="field" id="fRat" aria-label="Note minimale">
          <option value="0">Toutes les notes</option><option value="75">75 et +</option><option value="80">80 et +</option>
          <option value="83">83 et +</option><option value="85">85 et +</option><option value="87">87 et +</option><option value="90">90 et +</option>
        </select>
        <input class="field" id="fMax" type="number" inputmode="numeric" min="0" placeholder="Prix max" aria-label="Prix maximum">
        <select class="field" id="fSort" aria-label="Trier par">
          <option value="price-desc">Prix : du plus cher</option><option value="price-asc">Prix : du moins cher</option>
          <option value="rating-desc">Note : la plus haute</option><option value="chg-desc">Plus fortes hausses</option>
          <option value="chg-asc">Plus fortes baisses</option><option value="name-asc">Nom A → Z</option>
        </select>
        <div class="full row2"><button class="chip" id="fFav" aria-pressed="false">★ Favoris seulement</button><span class="small muted" id="count"></span></div>
      </div>
      <div id="list"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>

  <section class="page" id="p1" aria-label="Conseils"></section>
  <section class="page" id="p2" aria-label="SBC"></section>
  <section class="page" id="p3" aria-label="Portefeuille"></section>
  <section class="page" id="p4" aria-label="Réglages"></section>
</main>

<nav aria-label="Navigation"><div class="wrap" role="tablist" id="tabs">
  <span id="ind"></span>
  <button role="tab" data-tab="0" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Marché</button>
  <button role="tab" data-tab="1" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Conseils</button>
  <button role="tab" data-tab="2" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><path d="M17 13v8M13 17h8"/></svg>SBC</button>
  <button role="tab" data-tab="3" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>Portefeuille<i class="dot" id="dot"></i></button>
  <button role="tab" data-tab="4" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Réglages</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Fiche joueur"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
'use strict';

/* =====================================================================
   Outils
   ===================================================================== */
const TAX = 0.05;            // taxe EA : 5 %
const PAGE = 40;             // cartes par page
const REFRESH = 10 * 60e3;   // on relit data.json au plus toutes les 10 minutes
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nfr = new Intl.NumberFormat('fr-FR');
const fmt = (n) => (n == null || !isFinite(n) ? '—' : nfr.format(Math.round(n)));
const pct = (v) => (v == null ? '' : (v > 0 ? '+' : '') + (v * 100).toFixed(1).replace('.', ',') + ' %');
const norm = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const p2 = (n) => String(n).padStart(2, '0');
const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\//i.test(u.trim()) ? u.trim() : '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = (v) => { const n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };

/* =====================================================================
   Sauvegarde locale (localStorage, sinon mémoire)
   ===================================================================== */
const KEY = 'fc27companion.v1';
const mem = {};
let storageOK = false;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); storageOK = true; } catch (e) { storageOK = false; }
const store = {
  get(k) { try { if (storageOK) return localStorage.getItem(k); } catch (e) { storageOK = false; } return k in mem ? mem[k] : null; },
  set(k, v) { try { if (storageOK) { localStorage.setItem(k, v); return; } } catch (e) { storageOK = false; } mem[k] = v; },
  del(k) { try { if (storageOK) localStorage.removeItem(k); } catch (e) { storageOK = false; } delete mem[k]; }
};
const prefersReduced = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const defaults = () => ({ v: 1, theme: 'dark', anim: prefersReduced ? 'reduced' : 'full', card: 'source', favs: [], alerts: [], pf: [] });

function sanitize(o) {

    .map((p) => ({ k: String(p.k || uid()), id: String(p.id), buy: Number(p.buy), qty: Math.floor(Number(p.qty)), t: Number(p.t) || Date.now(), name: String(p.name || '') }));

let lastCheck = 0, loadedOnce = false;

const GROUPS = { GK: ['GK'], DEF: ['CB', 'LB', 'RB', 'LWB', 'RWB'], MIL: ['CDM', 'CM', 'CAM', 'LM', 'RM'], ATT: ['LW', 'RW', 'CF', 'ST', 'LF', 'RF', 'LS', 'RS'] };
const GROUP_NAMES = { GK: 'Gardiens', DEF: 'Défenseurs', MIL: 'Milieux', ATT: 'Attaquants' };
const STATK = ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY'];
const POS_RE = /LWB|RWB|GK|CB|LB|RB|CDM|CAM|CM|LM|RM|LW|RW|CF|ST|LF|RF|LS|RS/g;

function prep(c) {
  const price = Number.isFinite(Number(c.price)) && c.price !== null && Number(c.price) > 0 ? Number(c.price) : null;
  const h = Array.isArray(c.history) ? c.history.filter((x) => x && Number.isFinite(Number(x.p))).map((x) => ({ t: Number(x.t) || 0, p: Number(x.p) })) : [];
  const series = h.slice();
  if (price !== null && (!series.length || series[series.length - 1].p !== price)) series.push({ t: Date.parse(DATA.updatedAt) || Date.now(), p: price });
  let chg = null, min = null, max = null, avg = null;
  if (series.length) {
    let sum = 0; min = Infinity; max = -Infinity;
    for (const s of series) { sum += s.p; if (s.p < min) min = s.p; if (s.p > max) max = s.p; }
    avg = sum / series.length;
  }
  if (series.length >= 2) { const a = series[series.length - 2].p, b = series[series.length - 1].p; if (a > 0) chg = (b - a) / a; }
  const st = (c.stats && typeof c.stats === 'object') ? c.stats : {};
  const parts = [...new Set(String(c.pos || '').toUpperCase().match(POS_RE) || [])];
  return {
    id: String(c.id), name: String(c.name || 'Inconnu'), rating: Number(c.rating) || 0, pos: parts.length ? parts.join(', ') : String(c.pos || '').replace(/\+/g, ''), _pos: parts, playerImage: c.playerImageLarge || c.playerImage || '',
    club: String(c.club || ''), nation: String(c.nation || ''), league: String(c.league || ''), stats: st, cardImage: c.cardImageLarge || c.cardImage || '',
    price, _series: series, _chg: chg, _min: min, _max: max, _avg: avg,
    _n: norm([c.name, c.club, c.nation, c.league, c.pos].join(' '))
  };
}

function setData(d, u) {
  if (d && Array.isArray(d.cards)) {
    DATA = d;
    CARDS = d.cards.filter((c) => c && c.id != null).map(prep);
    MAP = new Map(CARDS.map((c) => [c.id, c]));
    MOVERS = CARDS.filter((c) => c._chg != null && c.price != null && c._chg !== 0)
      .sort((a, b) => Math.abs(b._chg) - Math.abs(a._chg)).slice(0, 14);
    POSLIST = [...new Set(CARDS.flatMap((c) => c._pos))].sort();
  }
  if (u && Array.isArray(u.sbcs)) UPCOMING = u.sbcs.filter((x) => x && typeof x === 'object' && x.name);
}

async function getJSON(url) {
  const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadAll() {
  lastCheck = Date.now();
  let d = null, u = null;
  try { d = await getJSON('data.json'); } catch (e) { /* ouverture en fichier ou aperçu : données vides */ }
  try { u = await getJSON('sbcs.json'); } catch (e) { }
  const first = !loadedOnce;
  loadedOnce = true;
  const changed = first || (d && (d.updatedAt !== DATA.updatedAt || (d.cards || []).length !== CARDS.length)) || (u && JSON.stringify(u.sbcs) !== JSON.stringify(UPCOMING));
  if (!changed) return;
  setData(d, u);
  afterData();
}

/* =====================================================================
   Dates
   ===================================================================== */
function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 0);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
const fmtDate = (d) => p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear();
const fmtDT = (d) => p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
function countdown(d) {
  if (!d) return '';
  const ms = d - Date.now();
  if (ms < 0) return 'terminé';
  const h = Math.floor(ms / 36e5), j = Math.floor(h / 24);
  if (j >= 2) return 'dans ' + j + ' jours';
  if (j === 1) return 'dans 1 jour';
  if (h >= 1) return 'dans ' + h + ' h';
  return 'dans moins d\'1 h';
}

// Netteté : le fond de la source est minuscule (64 px). On l'agrandit en plusieurs étapes avec lissage,
// puis on accentue légèrement les bords. Résultat gardé en mémoire (le même fond sert à beaucoup de cartes).
const UP = new Map();
function upscale(img) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  if (!w0 || !h0 || w0 >= 300) return null;
  let src = img, w = w0, h = h0;
  const tw = Math.min(Math.round(w0 * 5), 360);
  while (w < tw) {
    const nw = Math.min(w * 2, tw), nh = Math.round(h * nw / w);
    const c = document.createElement('canvas'); c.width = nw; c.height = nh;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    x.drawImage(src, 0, 0, nw, nh); src = c; w = nw; h = nh;
  }
  const ctx = src.getContext('2d');
  const d = ctx.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a);
  const k = 0.45;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = (y * w + x) * 4;
    if (a[i + 3] < 8) continue;
    for (let ch = 0; ch < 3; ch++) {
      const j = i + ch;
      const v = a[j] * (1 + 4 * k) - k * (a[j - 4] + a[j + 4] + a[j - w * 4] + a[j + w * 4]);
      o[j] = v;
    }
  }
  d.data.set(o); ctx.putImageData(d, 0, 0);
  return src.toDataURL('image/png');
}
document.addEventListener('load', (e) => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG' || !t.classList.contains('bg') || t.dataset.up) return;
  const key = t.currentSrc || t.src;
  if (UP.has(key)) { const v = UP.get(key); if (v) { t.dataset.up = '1'; t.src = v; } return; }
  let v = null;
  try { v = upscale(t); } catch (err) { v = null; }
  UP.set(key, v);
  if (v) { t.dataset.up = '1'; t.src = v; }
}, true);
// Si le fond ne charge pas : cadre gris avec la note. Si la photo ne charge pas : on l'enlève, le fond reste seul.
document.addEventListener('error', (e) => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG' || !t.dataset || !t.parentNode) return;
  if (t.dataset.face) { t.remove(); return; }
  if (t.dataset.alts) { const l = t.dataset.alts.split(' '); const o = l.shift(); if (l.length) t.dataset.alts = l.join(' '); else delete t.dataset.alts; t.src = o; return; }
  // Toutes les adresses ont échoué avec l'accès avancé (netteté) : on recommence une fois sans, comme avant.
  if (t.hasAttribute('crossorigin') && t.dataset.all) { t.removeAttribute('crossorigin'); const l = t.dataset.all.split(' '); t.dataset.all = ''; const o = l.shift(); t.dataset.alts = l.join(' '); if (!l.length) delete t.dataset.alts; t.src = o; return; }
  if (t.dataset.r !== undefined) {
    const box = t.parentNode; box.classList.add('fb'); box.innerHTML = '<b>' + esc(t.dataset.r) + '</b>';
  }
}, true);

const M = { q: '', pos: '', minR: 0, maxP: '', sort: 'price-desc', fav: false, page: 1 };

function buildPosFilter() {
  const sel = $('#fPos');
  let h = '<option value="">Tous les postes</option>';
  for (const g of Object.keys(GROUPS)) h += '<option value="g:' + g + '">' + GROUP_NAMES[g] + '</option>';
  if (POSLIST.length) h += '<optgroup label="Poste précis">' + POSLIST.map((p) => '<option value="' + esc(p) + '">' + esc(p) + '</option>').join('') + '</optgroup>';
  sel.innerHTML = h; sel.value = M.pos;
  if (sel.value !== M.pos) { M.pos = ''; sel.value = ''; }
}
function posMatch(c, f) { return f.startsWith('g:') ? c._pos.some((q) => GROUPS[f.slice(2)].includes(q)) : c._pos.includes(f); }

function filtered() {
  const q = norm(M.q).trim();
  const max = M.maxP === '' ? null : Number(M.maxP);
  const a = CARDS.filter((c) => {
    if (q && !c._n.includes(q)) return false;
    if (M.pos && !posMatch(c, M.pos)) return false;
    if (c.rating < M.minR) return false;
    if (max !== null && (c.price == null || c.price > max)) return false;
    if (M.fav && !FAV.has(c.id)) return false;
    return true;
  });
  const nl = (f, dir) => (x, y) => { // valeurs vides toujours à la fin
    const A = f(x), B = f(y);
    if (A == null && B == null) return 0; if (A == null) return 1; if (B == null) return -1;
    return dir * (A - B);
  };
  const [k, dir] = M.sort.split('-');
  if (k === 'price') a.sort(nl((c) => c.price, dir === 'asc' ? 1 : -1));
  else if (k === 'rating') a.sort((x, y) => y.rating - x.rating || (y.price || 0) - (x.price || 0));
  else if (k === 'chg') a.sort(nl((c) => c._chg, dir === 'asc' ? 1 : -1));
  else a.sort((x, y) => x.name.localeCompare(y.name, 'fr'));
  return a;
}

/* =====================================================================
   SBC : fusion « en cours » (robot) + « à venir » (sbcs.json)
   ===================================================================== */
const skey = (n) => norm(n).replace(/[^a-z0-9]+/g, ' ').trim();
function cleanReqs(r) {
  return (Array.isArray(r) ? r : []).map((x) => ({ minRating: Number(x && x.minRating), count: Math.floor(Number(x && x.count)) }))
    .filter((x) => x.minRating >= 40 && x.minRating <= 99 && x.count >= 1);
}
function buildSbcs() {
  const now = Date.now();
  const ups = new Map();
  for (const u of UPCOMING) { const k = skey(u.name); if (k && !ups.has(k)) ups.set(k, u); }
  const seen = new Set(), cur = [], up = [];
  for (const s of (DATA.sbcs || [])) {
    if (!s || !s.name) continue;
    const k = skey(s.name); if (!k || seen.has(k)) continue; seen.add(k);
    const d = parseDate(s.expires);
    if (d && d.getTime() < now) continue; // déjà terminé
    const u = ups.get(k);
    cur.push({ kind: 'cur', name: String(s.name), date: d, rawDate: String(s.expires || ''), url: safeUrl(s.url) || (u ? safeUrl(u.sourceUrl) : ''), reward: String(s.reward || ''),
      official: u ? !!u.official : true, reqs: u ? cleanReqs(u.requirements) : [], note: u ? String(u.note || '') : '' });
  }
  for (const [k, u] of ups) {
    if (seen.has(k)) continue;
    const d = parseDate(u.expectedDate);
    if (d && d.getTime() < now - 864e5) continue; // date passée
    up.push({ kind: 'up', name: String(u.name), date: d, rawDate: String(u.expectedDate || ''), url: safeUrl(u.sourceUrl), reward: '', official: !!u.official, reqs: cleanReqs(u.requirements), note: String(u.note || '') });
  }
  const bydate = (a, b) => (a.date ? a.date.getTime() : 9e15) - (b.date ? b.date.getTime() : 9e15);
  cur.sort(bydate); up.sort(bydate);
  return { cur, up };
}
const reqText = (r) => r.count + ' carte' + (r.count > 1 ? 's' : '') + ' de note ' + r.minRating + '+';

function sbcBlock(s) {
  const when = s.kind === 'cur'
    ? (s.date ? 'Expire le ' + fmtDate(s.date) + ' (' + countdown(s.date) + ')' : (s.rawDate ? 'Expire : ' + esc(s.rawDate) : 'Date d\'expiration inconnue'))
    : (s.date ? 'Prévu vers le ' + fmtDate(s.date) + ' (' + countdown(s.date) + ')' : 'Date inconnue');
  const badge = s.kind === 'up' ? (s.official ? '<span class="badge hi">Officiel</span>' : '<span class="badge lo">Non officiel</span>') : '';
  return '<div class="box"><div class="line" style="border:0;padding-top:0"><h3 style="margin:0">' + esc(s.name) + '</h3>' + badge + '</div>' +
    '<div class="small muted">' + when + '</div>' +
    (s.reqs.length ? '<div style="margin-top:6px">' + s.reqs.map((r) => '<span class="tag">' + esc(reqText(r)) + '</span>').join('') + '</div>'
      : '<div class="small muted" style="margin-top:6px">Prérequis inconnus : ajoute-les dans sbcs.json pour obtenir des conseils.</div>') +
    (s.reward ? '<div class="small" style="margin-top:4px">Récompense : ' + esc(s.reward) + '</div>' : '') +
    (s.note ? '<div class="small muted" style="margin-top:4px">' + esc(s.note) + '</div>' : '') +
    (s.url ? '<div class="small" style="margin-top:4px"><a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">Source</a></div>' : '') + '</div>';
}

function renderSbc() {
  const { cur, up } = buildSbcs();
  let h = '<h2>SBC en cours</h2>';
  h += cur.length ? cur.map(sbcBlock).join('') : '<div class="note">Aucun SBC en cours pour l\'instant. Le robot les récupère à chaque passage.</div>';

function advice(s, req) {
  const days = s.date ? (s.date.getTime() - Date.now()) / 864e5 : null;
  const up = Math.min(0.12, 0.02 * req.count) + (days != null && days >= 0 && days <= 3 ? 0.03 : 0);
  const out = [];
  for (const c of CARDS) {
    if (c.price == null || c.price < 150 || c._series.length < 2) continue;
    if (c.rating !== req.minRating && c.rating !== req.minRating + 1) continue;
    if (!(c.price < c._avg * 0.97)) continue;
    const target = c._avg * (1 + up);
    const gain = target * (1 - TAX) - c.price;
    if (gain <= 0) continue;
    const disc = (c._avg - c.price) / c._avg;
    let sd = 0; for (const p of c._series) sd += (p.p - c._avg) * (p.p - c._avg);
    const cv = Math.sqrt(sd / c._series.length) / c._avg;
    const conf = Math.max(0, Math.min(100, Math.round(
      30 * Math.min(1, c._series.length / 14) + 25 * Math.min(1, disc / 0.15) +
      25 * (days == null ? 0.3 : days <= 7 ? 1 : days <= 21 ? 0.6 : 0.3) + 20 * (1 - Math.min(1, cv / 0.2)))));
    out.push({ c, gain, gainPct: gain / c.price, conf, target });
  }
  out.sort((a, b) => b.gain - a.gain);
  return out.slice(0, 8);
}
const confBadge = (n) => '<span class="badge ' + (n >= 65 ? 'hi' : n >= 40 ? 'mid' : 'lo') + '">Confiance ' + (n >= 65 ? 'élevée' : n >= 40 ? 'moyenne' : 'faible') + ' (' + n + '/100)</span>';

let CURID = null;
function chartSvg(c) {
  const s = c._series;
  if (s.length < 2) return '<p class="muted small">Pas encore assez d\'historique pour une courbe : le robot ajoute un point à chaque passage.</p>';
  const W = 320, H = 130, P = 10, rng = (c._max - c._min) || 1;
  const x = (i) => P + i * (W - 2 * P) / (s.length - 1);
  const y = (v) => (c._max === c._min ? H / 2 : H - P - (v - c._min) / rng * (H - 2 * P));
  const pts = s.map((q, i) => x(i).toFixed(1) + ',' + y(q.p).toFixed(1)).join(' ');
  const last = s[s.length - 1];
  const line = (v, col) => '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="' + col + '" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>';
  const d0 = s[0].t ? new Date(s[0].t) : null, d1 = last.t ? new Date(last.t) : null;
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Courbe de prix">' + line(c._max, 'var(--down)') + line(c._avg, 'var(--muted)') + line(c._min, 'var(--up)') +
    '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + x(s.length - 1).toFixed(1) + '" cy="' + y(last.p).toFixed(1) + '" r="3.8" fill="var(--accent)"/></svg>' +
    '<div class="row2 small muted" style="justify-content:space-between"><span>' + (d0 ? fmtDate(d0) : '') + '</span><span>' + s.length + ' relevés</span><span>' + (d1 ? fmtDate(d1) : '') + '</span></div>' +
    '<div class="tri"><div><span class="small muted">Plus bas</span><b class="up">' + fmt(c._min) + '</b></div><div><span class="small muted">Moyenne</span><b>' + fmt(c._avg) + '</b></div><div><span class="small muted">Plus haut</span><b class="dn">' + fmt(c._max) + '</b></div></div>';
}

function download(name, text) {
  const a = document.createElement('a');

  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function restore(text) {
  let o; try { o = JSON.parse(text); } catch (e) { toast('Ce texte n\'est pas une sauvegarde valide'); return; }
  if (!o || typeof o !== 'object' || !('favs' in o || 'alerts' in o || 'pf' in o)) { toast('Ce n\'est pas une sauvegarde FC27 Companion'); return; }
  S = sanitize(o); FAV = new Set(S.favs); save(); applyLook(); checkAlerts(); renderMarket(); renderActive();
  toast('Sauvegarde restaurée');
}

  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'open': openSheet(id); break;
    case 'close': closeSheet(); break;

      if (FAV.has(id)) FAV.delete(id); else FAV.add(id);

      renderMarket(); if (TAB === 3) renderPortfolio();

      const v = num($('#alPrice').value);

    case 'export': download('fc27-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(S, null, 1)); break;

$('#fFav').addEventListener('click', (e) => { M.fav = !M.fav; e.currentTarget.setAttribute('aria-pressed', String(M.fav)); M.page = 1; renderMarket(); });

// Mise à jour seulement quand la page est visible
function maybeRefresh() { if (document.visibilityState === 'visible' && Date.now() - lastCheck > REFRESH) loadAll(); }
document.addEventListener('visibilitychange', maybeRefresh);
setInterval(maybeRefresh, 60e3);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') applyLook(); }); } catch (e) { }

/* =====================================================================
   Démarrage
   ===================================================================== */
applyLook();
$('#p0').classList.add('active');
renderHeader(); renderMarket(); updateDot();
loadAll();
})();
</script>
