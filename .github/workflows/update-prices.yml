name: Mise à jour des prix

on:
  schedule:
    - cron: '17 6 */2 * *'   # un jour sur deux, vers 6h17 (heure UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (auto = le robot choisit)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - list
          - snapshot
          - details
          - fiche
      pages:
        description: 'Nombre de pages (mode list). Vide = 25. Mets 350 pour tout le catalogue d un coup (3 crédits par page). Mets 1 pour un test.'
        required: false
        default: ''
        type: string
      min_rating:
        description: 'Mode list : note minimale des cartes (vide = 80). Mets 45 pour avoir TOUTES les cartes.'
        required: false
        default: ''
        type: string
      details_count:
        description: 'Modes details et fiche : combien de joueurs (les plus chers d abord). Vide = 3.'
        required: false
        default: ''
        type: string
      sort:
        description: 'Mode list : sens du tri. desc = normal. asc = 2e passage de contrôle pour rattraper les cartes ratées (le robot repart alors de la page 1).'
        required: true
        default: 'desc'
        type: choice
        options:
          - 'desc'
          - 'asc'
      parts:
        description: 'Mode snapshot : combien de paquets de 500 cartes en même temps. Vide = autant que de clés (le plus rapide).'
        required: false
        default: ''
        type: string
      reset_keys:
        description: 'Oublier les clés marquées vides ce mois-ci (à mettre sur oui si tu as rechargé des crédits)'
        required: true
        default: 'non'
        type: choice
        options:
          - 'non'
          - 'oui'
      restart:
        description: 'Repartir de la page 1 (test, ne change pas le point de reprise)'
        required: true
        default: 'non'
        type: choice
        options:
          - 'non'
          - 'oui'

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les prix
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
          PARSE_API_KEYS: ${{ secrets.PARSE_API_KEYS }}
          API_BASE: ${{ vars.API_BASE }}
          KEY_CREDITS: ${{ vars.KEY_CREDITS }}
          TOTAL_CREDITS: ${{ vars.TOTAL_CREDITS }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          MAX_PAGES: ${{ github.event.inputs.pages }}
          MIN_RATING: ${{ github.event.inputs.min_rating }}
          DETAILS_COUNT: ${{ github.event.inputs.details_count }}
          SORT: ${{ github.event.inputs.sort }}
          SNAPSHOT_PARTS: ${{ github.event.inputs.parts }}
          RESET_KEYS: ${{ github.event.inputs.reset_keys == 'oui' && '1' || '' }}
          RESTART: ${{ github.event.inputs.restart == 'oui' && '1' || '' }}
        run: node update-prices.mjs "$MODE"

      - name: Enregistrer data.json
        if: ${{ always() }}
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          for f in data.json watch.json keys-state.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer."
          else
            git commit -m "Mise à jour des prix"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
